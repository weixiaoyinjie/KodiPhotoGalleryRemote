name: Build PHOTO KODI Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # GitHub's Ubuntu runner already includes Android command-line tools.
      # Do not use android-actions/setup-android here: it can re-download an
      # older SDK manager and fail before the app is built.
      - name: Configure preinstalled Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_DIR/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_DIR/cmdline-tools" -type f -path '*/bin/sdkmanager' -print -quit 2>/dev/null || true)"
          fi
          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo 'ERROR: Preinstalled Android SDK manager was not found.' >&2
            exit 1
          fi

          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "Using SDK manager: $SDKMANAGER"
          "$SDKMANAGER" --version

          # Avoid network calls if SDK 35 is already available on the runner.
          if [ -d "$SDK_DIR/platforms/android-35" ] && [ -d "$SDK_DIR/build-tools/35.0.0" ]; then
            echo 'Android SDK 35 and Build Tools 35.0.0 are already installed.'
          else
            echo 'Installing missing SDK 35 packages...'
            # printf finishes normally even if sdkmanager stops reading.
            printf 'y\n%.0s' {1..50} | "$SDKMANAGER" --sdk_root="$SDK_DIR" --licenses
            "$SDKMANAGER" --sdk_root="$SDK_DIR" --install \
              'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'
          fi

          test -f "$SDK_DIR/platforms/android-35/android.jar"
          test -x "$SDK_DIR/build-tools/35.0.0/aapt2"
          echo 'Android SDK is ready.'

      - name: Extract the uploaded single ZIP
        id: project
        shell: bash
        run: |
          set -euo pipefail
          ZIP=$(find . -maxdepth 3 -type f -iname '*.zip' -not -path './.git/*' -print -quit)
          if [ -n "$ZIP" ]; then
            echo "Using source archive: $ZIP"
            mkdir -p extracted
            unzip -q "$ZIP" -d extracted
            SEARCH_ROOT="$GITHUB_WORKSPACE/extracted"
          else
            echo 'No ZIP found; checking out source directly.'
            SEARCH_ROOT="$GITHUB_WORKSPACE"
          fi

          PROJECT_DIR=$(find "$SEARCH_ROOT" -type f \( -name settings.gradle -o -name settings.gradle.kts \) -printf '%h\n' | sort | head -n 1)
          if [ -z "$PROJECT_DIR" ]; then
            echo 'ERROR: settings.gradle or settings.gradle.kts not found in the source.' >&2
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project: $PROJECT_DIR"

      - name: Compile Android debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew --no-daemon --stacktrace assembleDebug
          else
            gradle --no-daemon --stacktrace assembleDebug
          fi

      - name: Collect debug APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output-apk
          find "$PROJECT_DIR" -type f -path '*/build/outputs/apk/debug/*.apk' -exec cp -v '{}' output-apk/ \;
          if ! find output-apk -maxdepth 1 -type f -name '*.apk' | grep -q .; then
            echo 'ERROR: No debug APK found after building.' >&2
            exit 1
          fi

      - name: Publish APK
        uses: actions/upload-artifact@v4
        with:
          name: Android-Debug-APK
          path: output-apk/*.apk
          if-no-files-found: error
          retention-days: 14
