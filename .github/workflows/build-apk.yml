name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          command -v sdkmanager
          sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'

      - name: Extract the uploaded single ZIP
        id: project
        shell: bash
        run: |
          set -euo pipefail
          ZIP=$(find . -maxdepth 3 -type f -iname '*.zip' -not -path './.git/*' -print -quit)
          if [ -n "$ZIP" ]; then
            echo "Using source archive: $ZIP"
            mkdir -p extracted
            unzip -q "$ZIP" -d extracted
            SEARCH_ROOT="$GITHUB_WORKSPACE/extracted"
          else
            echo 'No ZIP found; checking out source directly.'
            SEARCH_ROOT="$GITHUB_WORKSPACE"
          fi

          PROJECT_DIR=$(find "$SEARCH_ROOT" -type f \( -name settings.gradle -o -name settings.gradle.kts \) -printf '%h\n' | sort | head -n 1)
          if [ -z "$PROJECT_DIR" ]; then
            echo 'ERROR: settings.gradle or settings.gradle.kts not found in the source.' >&2
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project: $PROJECT_DIR"

      - name: Compile Android debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew --no-daemon --stacktrace assembleDebug
          else
            gradle --no-daemon --stacktrace assembleDebug
          fi

      - name: Collect debug APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output-apk
          find "$PROJECT_DIR" -type f -path '*/build/outputs/apk/debug/*.apk' -exec cp -v '{}' output-apk/ \;
          if ! find output-apk -maxdepth 1 -type f -name '*.apk' | grep -q .; then
            echo 'ERROR: No debug APK found after building.' >&2
            exit 1
          fi

      - name: Publish APK
        uses: actions/upload-artifact@v4
        with:
          name: Android-Debug-APK
          path: output-apk/*.apk
          if-no-files-found: error
          retention-days: 14
