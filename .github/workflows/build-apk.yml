name: Build PHOTO KODI Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Extract the uploaded single ZIP
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="$GITHUB_WORKSPACE/KodiPhotoGalleryRemote_v1.0_OneUpload_Source.zip"
          if [ ! -f "$ARCHIVE" ]; then
            echo "Missing KodiPhotoGalleryRemote_v1.0_OneUpload_Source.zip in the repository root"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/photo-kodi"
          unzip -q "$ARCHIVE" -d "$RUNNER_TEMP/photo-kodi"
          test -f "$RUNNER_TEMP/photo-kodi/settings.gradle"
          test -f "$RUNNER_TEMP/photo-kodi/app/build.gradle"
          echo "PROJECT_DIR=$RUNNER_TEMP/photo-kodi" >> "$GITHUB_ENV"
      - name: Compile Android debug APK
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon -p "$PROJECT_DIR" assembleDebug
          mkdir -p "$GITHUB_WORKSPACE/apk-output"
          cp "$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk" "$GITHUB_WORKSPACE/apk-output/PHOTO-KODI-v1.0-debug.apk"
      - name: Publish APK
        uses: actions/upload-artifact@v4
        with:
          name: PHOTO-KODI-v1.0-debug
          path: apk-output/PHOTO-KODI-v1.0-debug.apk
          if-no-files-found: error
